    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      /* eslint-disable */
      (function () {
          /* eslint-disable */
          if (!window.$mcSite) {
              $mcSite = {
                  optinFeatures: [],

                  loadingPrerequisites: [],
                  permissionProviders: {},

                  registerPermissionProvider: function (permission, permissionResolutionPromise) {
                      window.$mcSite.permissionProviders[permission] = permissionResolutionPromise;
                  },

                  enableOptIn: function () {
                      this.createCookie("mc_user_optin", true, 365);
                      this.optinFeatures.forEach(function (fn) {
                          fn();
                      });
                  },

                  runIfOptedIn: function (fn, additionalPermissions) {
                      Promise.all(this.loadingPrerequisites).then(function () {
                          this._runIfOptedIn.call(this, fn, additionalPermissions);
                      }.bind(this));
                  },

                  _runIfOptedIn: function (fn, additionalPermissions) {
                      if (!additionalPermissions || additionalPermissions.length === 0) {
                          if (this.hasOptedIn()) {
                              fn();
                          } else {
                              this.optinFeatures.push(fn);
                          }
                      } else {
                          var wrappedPermmissionsFn = function () {
                              if (additionalPermissions.length === 0) {
                                  fn();
                              }

                              // Get available permission providers
                              var permissionProviders = additionalPermissions.reduce(function (providers, permission) {
                                  if (window.$mcSite.permissionProviders[permission]) {
                                      providers.push(window.$mcSite.permissionProviders[permission]);
                                  }
                                  return providers;
                              }, []);

                              // Check if all permissions are granted
                              Promise.all(permissionProviders).then(function (results) {
                                  var allPermissionsGranted = results.every(function (result) {
                                      return result === true;
                                  });

                                  if (allPermissionsGranted) {
                                      fn();
                                  }
                              });
                          }

                          if (this.hasOptedIn()) {
                              wrappedPermmissionsFn();
                          } else {
                              this.optinFeatures.push(wrappedPermmissionsFn);
                          }
                      }
                  },

                  hasOptedIn: function () {
                      var cookieValue = this.readCookie("mc_user_optin");

                      if (cookieValue === undefined) {
                          return true;
                      }

                      return cookieValue === "true";
                  },

                  createCookie: function (name, value, expirationDays) {
                      var cookie_value = encodeURIComponent(value) + ";";

                      if (expirationDays === undefined) {
                          throw new Error("expirationDays is not defined");
                      }

                      // set expiration
                      if (expirationDays !== null) {
                          var expirationDate = new Date();
                          expirationDate.setDate(expirationDate.getDate() + expirationDays);
                          cookie_value += " expires=" + expirationDate.toUTCString() + ";";
                      }

                      cookie_value += "path=/";
                      document.cookie = name + "=" + cookie_value;
                  },

                  readCookie: function (name) {
                      var nameEQ = name + "=";
                      var ca = document.cookie.split(";");

                      for (var i = 0; i < ca.length; i++) {
                          var c = ca[i];

                          while (c.charAt(0) === " ") {
                              c = c.substring(1, c.length);
                          }

                          if (c.indexOf(nameEQ) === 0) {
                              return c.substring(nameEQ.length, c.length);
                          }
                      }

                      return undefined;
                  }
              };
          }

          

          $mcSite.amped_forms={settings:{uid:"256134187",src:"https:\/\/form-assets.mailchimp.com\/snippet\/account\/",site_unique_id:"41cdb0bd39089e05f0fba4af8"}};
      })();
      (function () {
          var module = window.$mcSite.amped_forms;

          if (module.installed === true) {
              return;
          }

          if (!module.settings) {
              return;
          }

          var settings = module.settings;

          if (!settings.uid) {
              return;
          }

          window.$mcSite.runIfOptedIn(function () {
              var script = document.createElement("script");

              var fixedUrl = settings.src.replace("\\/", "/");

              script.src = fixedUrl + settings.uid + "?site=" + settings.site_unique_id;
              script.type = "text/javascript";

              (document.body || document.head).appendChild(script);
          }, [
              "preferencesProcessingAllowed",
              "analyticsProcessingAllowed",
              "marketingAllowed"
          ]);
      }());
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
